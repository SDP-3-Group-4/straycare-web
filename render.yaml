services:
  - type: web
    name: straycare-backend
    runtime: docker
    plan: free
    dockerfilePath: ./straycare-backend/Dockerfile
    dockerContext: ./straycare-backend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: straycare-dev
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: 10000
      - key: NIM_API_KEY
        sync: false
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NIM_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: NIM_RESCUE_MODEL
        value: nvidia/nemotron-mini-4b-instruct
      - key: NIM_TIMEOUT_MS
        value: 60000
      - key: AI_RESPONSE_INTERVAL_MIN
        value: 10
      - key: AI_RESPONSE_WAIT_MIN
        value: 30
      - key: AI_RATE_LIMIT_MAX
        value: 10
      - key: AI_RATE_LIMIT_WINDOW_MIN
        value: 2
