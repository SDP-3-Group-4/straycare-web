services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: straycare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d straycare"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./straycare-backend
    env_file: ./straycare-backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/straycare?schema=public
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/service-account.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173}
      PORT: "3000"
    volumes:
      - ${SERVICE_ACCOUNT_FILE:-./straycare-backend/firebase-service-account.json}:/app/service-account.json:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-AIzaSyCsViNjgPJyMZ5C64nN7CSggy65CaZFq8A}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-straycare-dev.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-straycare-dev}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-straycare-dev.firebasestorage.app}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-167700736671}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:167700736671:web:673db620ad99e9802390aa}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: