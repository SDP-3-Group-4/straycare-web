<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StrayCare — Connecting communities to help stray animals find care, shelter, and love." />
    <meta name="theme-color" content="#772BFB" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..900&display=swap" rel="stylesheet">
    <title>StrayCare — Home</title>
    
    <style>
      /* Hide default Google Translate bar and branding overlay */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0px !important; }
      #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
      .skiptranslate iframe { display: none !important; }
    </style>

    <script>
      // Non-blocking early cold-start handshake
      try {
        var api = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://straycare-backend-se6q.onrender.com';
        fetch(api + '/posts?tab=explore', { mode: 'no-cors', cache: 'no-store' }).catch(function(){});
      } catch(e){}
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display: none;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,bn,es,fr,de,hi,ar,zh-CN',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
